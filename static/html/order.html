<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="utf-8">
    <title>Поръчка — BlendBar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/global.js"></script>
    <script src="/js/order.js"></script>
</head>
<body>
    <div id="navbar"></div>

    <main>
        <section class="hero" style="padding: 4rem 2.5rem 5.5rem;">
          <span class="hero-eyebrow">Направете Поръчка</span>
          <h1 style="font-size: clamp(2.5rem,7vw,4.5rem);">Поръчайте<br><em>Пресна Смес</em></h1>
          <p>Изберете смути, изберете размер и ще го приготвим за ~5 минути.</p>
        </section>

        <div class="section" style="padding-top: 2.5rem; max-width: 1240px;">

          <div id="flash-message" class="flash" style="display:none; margin-bottom:1.5rem;"></div>

          <div class="cart-layout">

            <!-- ── Left: Smoothie Catalog ── -->
            <div class="catalog-panel">
              <h2 class="panel-title">Меню</h2>
              <div id="catalog-grid" class="catalog-grid">
                <!-- Populated by JS -->
              </div>
            </div>

            <!-- ── Right: Cart ── -->
            <div class="cart-panel">
              <div class="cart-sticky">
                <div class="cart-box">

                  <h2 class="panel-title">
                    Количка
                    <span id="cart-count" class="cart-badge" style="display:none;">0</span>
                  </h2>

                  <!-- Empty state -->
                  <div id="cart-empty" class="cart-empty">
                    <div style="font-size:2.8rem; margin-bottom:.8rem;">🧃</div>
                    <p>Количката е празна.<br>Добавете смути от менюто.</p>
                  </div>

                  <!-- Cart items (shown when cart has items) -->
                  <div id="cart-items" style="display:none;">
                    <div id="cart-list"></div>

                    <div class="cart-totals">
                      <div class="cart-total-row">
                        <span>Общо ккал</span>
                        <span id="total-calories">0 ккал</span>
                      </div>
                      <div class="cart-total-row" style="margin-bottom:.3rem;">
                        <span>Протеин</span>
                        <span id="total-protein">0г</span>
                      </div>
                      <div class="cart-total-row cart-total-price">
                        <span>Обща цена</span>
                        <span id="total-price">€0.00</span>
                      </div>
                    </div>

                    <div id="customer-name-group" class="form-group" style="margin-top:1.2rem;">
                      <label for="customer_name">Вашето Име</label>
                      <input type="text" id="customer_name" placeholder="напр. Алекс" />
                    </div>

                    <button id="place-order-btn" class="btn-full" style="margin-top:.8rem;">
                      Поръчай
                    </button>
                  </div>

                </div>
              </div>
            </div>

          </div>
        </div>
    </main>

    <div id="footer"></div>
</body>
</html>
