<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="utf-8">
    <title>Поръчка — BlendBar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/global.js"></script>
    <script src="/js/order.js"></script>
</head>
<body>
    <div id="navbar"></div>

    <main class="container">
        <section class="hero" style="padding: 4rem 2.5rem 5.5rem;">
          <span class="hero-eyebrow">🛒 Направете Поръчка</span>
          <h1 style="font-size: clamp(2.5rem,7vw,4.5rem);">Поръчайте<br><em>Пресна Смес</em></h1>
          <p>Изберете смути, изберете размер и ще го приготвим за ~5 минути.</p>
        </section>

        <section class="section" style="padding-top: 3rem;">
          <div class="order-wrapper">

            <div id="flash-message" class="flash" style="display:none;"></div>

            <div class="order-card">
              <h2 style="font-family:'Fraunces',serif; color:var(--emerald); margin-bottom:1.8rem; font-size:1.6rem;">Вашата Поръчка</h2>

              <form id="order-form">
                
                <div class="form-group" id="customer-name-group">
                  <label for="customer_name">Вашето Име</label>
                  <input
                    type="text"
                    id="customer_name"
                    name="customer_name"
                    placeholder="напр. Алекс"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="smoothie_id">Изберете Смути</label>
                  <select id="smoothie_id" name="smoothie_id" required>
                    <option value="" disabled selected>Изберете смути...</option>
                    <!-- Populated by JS -->
                  </select>
                </div>

                <div class="form-group">
                  <label for="size">Размер</label>
                  <select id="size" name="size" required>
                    <option value="" disabled selected>Изберете размер...</option>
                    <option value="small">Малка (×0.75 макроси)</option>
                    <option value="medium">Средна (×1.0 макроси)</option>
                    <option value="large">Голяма (×1.3 макроси)</option>
                  </select>
                </div>

                <button type="submit" class="btn-full" id="submit-btn">Поръчай 🥤</button>
              </form>
            </div>

            <!-- Quick link to menu -->
            <p style="text-align:center; margin-top:1.5rem; color:var(--text-muted); font-size:.9rem;">
              Не сте сигурни какво да изберете? <a href="/menu.html" style="color:var(--emerald); font-weight:600;">Разгледайте пълното меню →</a>
            </p>

          </div>
        </section>
    </main>

    <div id="footer"></div>
</body>
</html>
