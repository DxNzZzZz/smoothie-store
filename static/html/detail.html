<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="utf-8">
    <title>Детайли — BlendBar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/global.js"></script>
    <script src="/js/detail.js"></script>
</head>
<body>
    <div id="navbar"></div>

    <main class="container">
        <!-- Detail hero -->
        <div class="detail-hero" id="detail-hero">
            <p>Зареждане...</p>
        </div>

        <section class="section" style="padding-top: 3.5rem;">
            <!-- Tags -->
            <div class="tags" id="detail-tags" style="justify-content: center; margin-bottom: 2.5rem;">
            </div>

            <!-- Macros large -->
            <h2 class="section-title" style="text-align:center; margin-bottom:1.5rem; font-size:1.4rem;">Хранителни Стойности (пълна порция)</h2>
            <div class="macros-large" id="detail-macros">
            </div>

            <!-- Size scaling note -->
            <p style="text-align:center; color:var(--text-muted); font-size:.85rem; margin-bottom:3.5rem;">
              Малка = ×0.75 &nbsp;|&nbsp; Средна = ×1.0 &nbsp;|&nbsp; Голяма = ×1.3
            </p>

            <!-- Ingredients -->
            <h2 class="section-title" style="margin-bottom:1.5rem;">Съставки</h2>
            <div class="ingredient-grid" id="detail-ingredients">
            </div>

            <!-- CTAs -->
            <div style="display:flex; gap:1rem; justify-content:center; margin-top:3.5rem; flex-wrap:wrap;">
              <a href="/order.html" class="btn">Поръчай Това Смути 🥤</a>
              <a href="/menu.html" class="btn btn-outline">← Обратно към Менюто</a>
            </div>
        </section>
    </main>

    <div id="footer"></div>
</body>
</html>
